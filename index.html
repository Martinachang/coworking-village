<title>co-working space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@500;600;700;900&family=Noto+Sans+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one full-bleed hand-drawn stage (3/4 top-down open village + front-view rooms); paper-sticker HUD pinned to the edges. Single warm-paper look by design. */
:root{
  --ink:#5b5856;
  --ink-soft:#8a8580;
  --cream:#f8f2ec;
  --paper:#fffaf3;
  --blue:#5b7cc4;
  --orange:#e0784a;
  --yellow:#f5cd52;
  --green:#4da97c;
  --apricot:#f5b475;
  --pink:#f39bb3;
  --round:"Huninn","M PLUS Rounded 1c","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --grain:none;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--round)}
body{margin:0}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:var(--cream);touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;filter:none}
#vint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(60,40,20,.10) 100%);mix-blend-mode:multiply}
.hud{position:absolute;z-index:3}
button{font-family:var(--round);color:var(--ink);cursor:pointer;border:0;line-height:1.2}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.paper{background:var(--paper) var(--grain);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(91,88,86,.85)}
.btn{font-weight:800;font-size:14px;padding:7px 15px;border-radius:999px;color:#fff;background:var(--blue);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn.pink{background:var(--pink)}
.btn.green{background:var(--green)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

#coins{top:calc(10px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:6px;border-radius:999px;padding:3px 14px 3px 4px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
#coins.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.15)}}
.coin{width:24px;height:24px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-size:11px;color:var(--ink);font-weight:800;box-sizing:border-box}
#scenePill{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);border-radius:999px;padding:4px 18px 6px;text-align:center;min-width:170px}
#sceneT{display:block;font-size:15px;font-weight:800}
.lv{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);margin-top:2px}
.lv i{flex:1;height:8px;border-radius:9px;background:#efe6da;border:1.5px solid var(--ink);overflow:hidden}
.lv em{display:block;height:100%;width:0;background:var(--apricot)}
#pomo{top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;align-items:center;gap:6px;border-radius:999px;padding:3px 5px}
#pomo .rb{width:30px;height:30px;border-radius:50%;font-size:12px;padding:0;color:#fff;background:var(--orange);border:2px solid var(--ink)}
#pomo .rb.alt{background:var(--paper);color:var(--ink)}
#ptime{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
#pmode{font-size:11px;color:var(--ink-soft);font-weight:700}
#bars{right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.vbar{display:flex;flex-direction:column;align-items:center;gap:3px}
.vbar i{width:16px;height:84px;border-radius:12px;background:var(--paper);border:2px solid var(--ink);position:relative;overflow:hidden;box-sizing:border-box}
.vbar em{position:absolute;left:0;right:0;bottom:0;height:0}
.vbar .bi{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;box-sizing:border-box}
.vbar .bi svg{width:15px;height:15px;fill:#fff}
#sndBtn{left:12px;top:calc(54px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink)}
#sndBtn svg{width:21px;height:21px;fill:currentColor}
#sndBtn .x{display:none} #sndBtn.off .x{display:block} #sndBtn.off .w{display:none}
#rate{font-size:12px;font-weight:800;color:var(--green);margin-left:2px}
#chatBox{align-items:flex-start}
#chatBox.min #log,#chatBox.min #chat,#chatBox.min #chatSend{display:none}
#chatBox.min #chatF{gap:0}
#chatF{align-items:center;width:100%;box-sizing:border-box}
#chatTog{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink)}
#chatTog svg{width:20px;height:20px;fill:var(--ink)}
#chatTog i{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid #fff}
#chatTog i[hidden]{display:none}
#chatSend{flex:none;width:40px;height:40px;padding:0;display:grid;place-items:center}
#chatSend svg{width:19px;height:19px;fill:#fff}
#chatBox.min{width:auto}
#log{width:100%;box-sizing:border-box}
#chatBox{left:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 24px));display:flex;flex-direction:column;gap:6px}
#log{display:flex;flex-direction:column;gap:3px;max-height:120px;overflow:auto;font-size:13px;line-height:1.45}
#log:empty{display:none}
#log .m{background:rgba(255,250,243,.92);border:1.5px solid rgba(91,88,86,.35);border-radius:12px;padding:2px 10px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
#log .m b{font-weight:800}
#log .sys{color:#3f69b8;font-weight:700}
#log .m{transition:opacity .8s ease}
#log .m.out{opacity:0}
#chatF{display:flex;gap:6px}
#chat{flex:1;min-width:0;font-family:var(--round);font-size:14px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 14px}
#dock{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;border-radius:24px;padding:6px 8px;max-width:calc(100vw - 24px)}
.dk{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:2px 4px;font-size:11px;font-weight:800;min-width:50px}
.dk .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--blue);border:2px solid var(--ink);box-sizing:border-box}
.dk.p .ic{background:var(--pink)} .dk.g .ic{background:var(--green)} .dk.y .ic{background:var(--yellow)} .dk.o .ic{background:var(--orange)} .dk.a .ic{background:var(--apricot)}
.dk:disabled{opacity:.4;cursor:default}
.dk svg{width:26px;height:26px}
#dStatus .ic{transition:background .2s}
#pop{position:absolute;z-index:6;border-radius:18px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:min(330px,calc(100vw - 24px))}
#pop button{display:flex;align-items:center;gap:6px;background:var(--cream);border:1.5px solid rgba(91,88,86,.4);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
#pop button[aria-pressed="true"]{background:#fbe3c6;border-color:var(--ink)}
#pop img{width:24px;height:24px}
#toast{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);border-radius:999px;padding:7px 18px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:9;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fade{position:absolute;inset:0;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .2s;z-index:4}
#fade.on{opacity:1}
#card{position:absolute;z-index:6;border-radius:20px;padding:12px;width:200px;display:grid;gap:8px}
#card h3{margin:0;font-size:16px}
#card p{margin:0;font-size:12px;color:var(--ink-soft)}
#card .row{display:flex;gap:6px;flex-wrap:wrap}
#card .btn{font-size:12px;padding:5px 11px}
#decor{left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100vw - 24px));border-radius:22px;padding:10px 12px;display:grid;gap:8px;z-index:5}
#decor header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
#decor header small{font-weight:500;color:var(--ink-soft);font-size:12px}
.trays{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;align-items:stretch}
.tray{display:flex;gap:8px;flex:none}
.trays .sep{flex:none;width:2px;border-radius:2px;background:#e6dccf}
.tray button{flex:none;width:72px;background:var(--cream);border:1.5px solid rgba(91,88,86,.3);border-radius:14px;padding:4px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tray button[aria-pressed="true"]{border:2px solid var(--ink);background:#fbe3c6}
.tray canvas{width:56px;height:56px}
.tray .n{position:absolute;top:2px;right:5px;font-size:11px;background:var(--orange);color:#fff;border-radius:999px;padding:0 6px;border:1.5px solid var(--ink)}
.tray button:disabled{opacity:.35}
#itemCtl{position:absolute;z-index:5;display:flex;gap:4px;transform:translate(-50%,-100%)}
#itemCtl .btn{font-size:12px;padding:4px 10px}

.modal{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(91,88,86,.3);padding:14px}
.sheet{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:28px;padding:16px 18px 18px;display:grid;gap:12px;box-sizing:border-box}
.sheet.wide{width:min(780px,100%)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h2{margin:0;font-size:20px;font-weight:800}
.sheet .sub{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.55}
.x{width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:800;background:var(--paper);border:2px solid var(--ink);flex:none}
.ward{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
.ward .stage{display:grid;gap:8px;justify-items:center}
#wPrev{width:200px;height:220px;border-radius:22px;background:#fbe3c6;border:2px solid var(--ink)}
#wName{font-family:var(--round);font-size:15px;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;width:100%;box-sizing:border-box;text-align:center;background:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;background:var(--cream);border:1.5px solid rgba(91,88,86,.35)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs.ico button{width:44px;height:40px;padding:0;display:grid;place-items:center;border-radius:14px}
.tabs.ico svg{width:23px;height:23px;fill:currentColor}
.tabs.ico svg .st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;min-width:0}
.opt{background:#fff;border-radius:16px;padding:4px;border:1.5px solid rgba(91,88,86,.25);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;position:relative}
.opt canvas{width:80px;height:80px;display:block}
.opt .pr{position:absolute;right:4px;bottom:3px;background:rgba(255,255,255,.92);border-radius:999px;padding:0 5px 0 2px}
.opt[aria-pressed="true"]{border:2.5px solid var(--ink);background:#fbe3c6}
.opt .pr,.pr{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800}
.pr .coin{width:15px;height:15px;font-size:8px;border-width:1.5px}
.opt.lock{opacity:.55}
.sw{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--ink);box-sizing:border-box;display:block}
.wfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wfoot small{color:var(--ink-soft)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:#fff;border-radius:18px;padding:8px;border:1.5px solid rgba(91,88,86,.25);display:grid;gap:4px;justify-items:center;text-align:center}
.item canvas{width:96px;height:80px}
.item b{font-size:14px}
.item small{font-size:11px;color:var(--ink-soft)}
.item .btn{font-size:12px;padding:4px 12px}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:6px 10px;border:1.5px solid rgba(91,88,86,.25);min-width:0}
.li canvas{width:48px;height:48px}
.li b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{font-size:12px;color:var(--ink-soft)}
.li .btn{font-size:12px;padding:5px 12px}
.empty{font-size:13px;color:var(--ink-soft);background:var(--cream);border-radius:16px;padding:12px;text-align:center}
.mapwrap{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:14px;align-items:start}
#mini{width:100%;aspect-ratio:1;border-radius:18px;border:2px solid var(--ink);background:#c9dfb0;display:block}
.places{display:grid;gap:8px}
.places button{background:#fff;border-radius:16px;padding:8px 12px;border:1.5px solid rgba(91,88,86,.25);text-align:left;display:grid;grid-template-columns:14px 1fr;gap:2px 10px;align-items:center}
.places i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink);grid-row:span 2}
.places b{font-size:14px}
.places small{font-size:12px;color:var(--ink-soft)}
.sectionT{font-size:13px;font-weight:800;color:var(--ink-soft);margin:4px 0 0}
#dgInfo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800}
#dgWord{font-size:18px;color:var(--orange);letter-spacing:.1em}
#dgTime{font-variant-numeric:tabular-nums;background:var(--cream);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px}
#dgTime:empty{display:none}
.dgWrap{background:#fff;border-radius:18px;border:2px solid var(--ink);overflow:hidden}
#dgCv{display:block;width:100%;aspect-ratio:3/2;touch-action:none;cursor:crosshair}
#dgTools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#dgTools .pc{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink)}
#dgTools .pc[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
#dgGuesses{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;min-height:22px}
#dgGuesses span{background:var(--cream);border-radius:999px;padding:2px 10px}
#dgGuesses span.ok{background:#d2eadb;color:#2e7d58;font-weight:800}
#dgF{display:flex;gap:8px}
#dgIn{flex:1;min-width:0;font-family:var(--round);font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:7px 14px;color:var(--ink)}
/* ===== animal-island-ui design language (MIT, github.com/guokaigdg/animal-island-ui): re-implemented in plain CSS ===== */
:root{
  --animal-font:Nunito,"Noto Sans TC","Noto Sans SC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
  --animal-primary:#19c8b9;--animal-primary-hover:#3dd4c6;--animal-primary-active:#11a89b;--animal-primary-bg:#e6f9f6;
  --animal-text:#794f27;--animal-text-body:#725d42;--animal-text-secondary:#9f927d;--animal-text-muted:#8a7b66;
  --animal-bg:#f8f8f0;--animal-content:rgb(247,243,223);--animal-border:#c4b89e;--animal-sand:#e2d6bd;
  --animal-shadow-btn:#bdaea0;--animal-shadow-input:#d4c9b4;--animal-focus:#ffcc00;--animal-focus-d:#e0b800;
  --animal-warning:#f5c31c;--animal-success:#6fba2c;--animal-success-d:#5a9e1e;--animal-error:#e05a5a;--animal-error-d:#c94444;--animal-soft:#b7c6e5;
  --animal-sh-sm:0 2px 4px rgba(61,52,40,.06);--animal-sh:0 3px 10px rgba(61,52,40,.10);
  --animal-ease:cubic-bezier(.4,0,.2,1);
  --ink:#794f27;--ink-soft:#9f927d;--cream:#f8f8f0;--paper:rgb(247,243,223);
  --blue:#19c8b9;--orange:#19c8b9;--yellow:#f5c31c;--green:#6fba2c;--apricot:#b7c6e5;--pink:#e8837f;
  --round:var(--animal-font);
}
html,body,#app{background:var(--animal-bg)}
body{font-weight:500;letter-spacing:.01em}
button:focus-visible{outline:2px solid var(--animal-primary);outline-offset:2px}
input:focus-visible{outline:2px solid var(--animal-focus);outline-offset:1px;border-color:var(--animal-focus)!important}
.paper{background:var(--animal-content);border:2px solid var(--animal-border);box-shadow:var(--animal-sh)}
/* buttons: primary = teal pill with stacked 3D shadow; others soft */
.btn{font-weight:700;font-size:14px;letter-spacing:.02em;padding:9px 20px;border-radius:50px;color:#fff9e3;background:var(--animal-primary);border:2px solid var(--animal-primary);box-shadow:0 4px 0 0 var(--animal-primary-active);transition:transform .15s var(--animal-ease),box-shadow .15s var(--animal-ease),background .15s var(--animal-ease)}
.btn:hover:not(:disabled){transform:translateY(-1px);background:var(--animal-primary-hover);border-color:var(--animal-primary-hover);box-shadow:0 5px 0 0 var(--animal-primary-active)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 0 var(--animal-primary-active)}
.btn.orange{background:var(--animal-primary);border-color:var(--animal-primary)}
.btn.pink{color:#794f27;background:var(--animal-warning);border-color:var(--animal-warning);box-shadow:0 4px 0 0 var(--animal-focus-d)}
.btn.pink:hover:not(:disabled){background:#ffd23d;border-color:#ffd23d;box-shadow:0 5px 0 0 var(--animal-focus-d)}
.btn.pink:active:not(:disabled){box-shadow:0 1px 0 0 var(--animal-focus-d)}
.btn.green{background:var(--animal-success);border-color:var(--animal-success);box-shadow:0 4px 0 0 var(--animal-success-d)}
.btn.green:hover:not(:disabled){background:#7cc83a;border-color:#7cc83a;box-shadow:0 5px 0 0 var(--animal-success-d)}
.btn.ghost{color:var(--animal-text);background:var(--animal-bg);border-color:var(--animal-border);box-shadow:var(--animal-sh-sm)}
.btn.ghost:hover:not(:disabled){color:var(--animal-primary);border-color:var(--animal-primary);background:var(--animal-bg);box-shadow:var(--animal-sh)}
.btn:disabled{opacity:.5}
.coin{background:var(--animal-warning);border:2px solid var(--animal-focus-d);color:#794f27}
#coins{padding:3px 16px 3px 5px;font-weight:700}
#rate{color:var(--animal-primary-active)}
#scenePill{border-radius:24px}
#sceneT{font-weight:800;color:var(--animal-text)}
.lv{color:var(--animal-text-muted)}
.lv i{height:10px;background:radial-gradient(circle,rgba(196,184,158,.18) 1.5px,transparent 1.5px) 5px 5px/10px 10px,var(--animal-bg);border:2px solid var(--animal-sand);box-sizing:border-box}
.lv em{background:linear-gradient(90deg,#19c8b9,#6fe0d3)}
#pomo{border-radius:50px}
#pomo .rb{background:var(--animal-primary);border:2px solid var(--animal-primary);box-shadow:0 2px 0 var(--animal-primary-active);color:#fff9e3}
#pomo .rb.alt{background:var(--animal-bg);border-color:var(--animal-border);color:var(--animal-text);box-shadow:0 2px 0 var(--animal-shadow-input)}
/* vertical status bars */
.vbar i{background:radial-gradient(circle,rgba(196,184,158,.2) 1.5px,transparent 1.5px) 3px 3px/9px 9px,var(--animal-bg);border:2px solid var(--animal-sand);width:18px}
.vbar .bi{border:2px solid var(--animal-bg);box-shadow:0 2px 0 rgba(61,52,40,.18)}
/* dock */
#dock{border-radius:30px;padding:7px 10px}
.dk{--ic:var(--animal-primary);color:var(--animal-text)}
.dk.o{--ic:#d99a2b}.dk.p{--ic:#e8837f}.dk.g{--ic:var(--animal-success)}.dk.a{--ic:#7f95cf}.dk.y{--ic:#d99a2b}
.dk .ic,.dk.p .ic,.dk.g .ic,.dk.y .ic,.dk.o .ic,.dk.a .ic{background:#fffdf3;border:2px solid var(--animal-sand);box-shadow:0 4px 0 0 var(--animal-shadow-input);transition:transform .15s var(--animal-ease),box-shadow .15s var(--animal-ease)}
.dk svg{fill:var(--ic)}
#dStatus svg{fill:#fff}
#dStatus .ic{border-color:rgba(255,255,255,.7);box-shadow:0 4px 0 0 rgba(61,52,40,.22)}
.dk:hover:not(:disabled) .ic{transform:translateY(-2px);box-shadow:0 6px 0 0 var(--animal-shadow-input)}
.dk:active:not(:disabled) .ic{transform:translateY(2px);box-shadow:0 1px 0 0 var(--animal-shadow-input)}
.dk:focus-visible{outline-offset:0;border-radius:50%}
/* chat */
#log .m{background:rgba(248,248,240,.95);border:2px solid var(--animal-sand);border-radius:16px;padding:3px 12px;color:var(--animal-text-body)}
#log .sys{color:var(--animal-primary-active)}
#chat{font-family:var(--animal-font);font-weight:500;background:#fff;border:2px solid var(--animal-border);border-radius:50px;padding:8px 16px;color:var(--animal-text)}
#chat::placeholder{color:var(--animal-text-disabled,#c4b89e);font-weight:400}
#chatTog{background:var(--animal-bg);border:2px solid var(--animal-border);box-shadow:0 4px 0 0 var(--animal-shadow-btn)}
#chatTog svg{fill:var(--animal-text)}
#chatTog i{background:var(--animal-primary);border-color:var(--animal-bg)}
#chatTog:active{transform:translateY(2px);box-shadow:0 1px 0 0 var(--animal-shadow-btn)}
#chatSend{padding:0}
#sndBtn{color:var(--animal-text)}
/* popovers & cards */
#pop,#card,#decor{border-radius:20px}
#pop button{background:var(--animal-bg);border:2px solid var(--animal-sand);color:var(--animal-text);font-weight:600;transition:all .2s var(--animal-ease)}
#pop button:hover{background:rgba(25,200,185,.1);border-color:var(--animal-primary)}
#pop button[aria-pressed="true"]{background:var(--animal-primary);border-color:var(--animal-primary);color:#fff9e3}
#card p{color:var(--animal-text-muted)}
#toast{background:var(--animal-bg);border:2px solid var(--animal-border);color:var(--animal-text-body);font-weight:600;box-shadow:var(--animal-sh);border-radius:50px}
#fade{background:var(--animal-bg)}
/* tray / tabs / options */
.tray button,.opt,.item,.li,.places button{background:#fff;border:2px solid var(--animal-sand);border-radius:18px;color:var(--animal-text);transition:transform .2s var(--animal-ease),border-color .2s var(--animal-ease),background .2s var(--animal-ease)}
.tray button:hover:not(:disabled),.opt:hover,.places button:hover{transform:translateY(-2px);border-color:var(--animal-border)}
.tray button[aria-pressed="true"],.opt[aria-pressed="true"]{border:2px solid var(--animal-primary);background:var(--animal-primary-bg)}
.tray .n{background:var(--animal-primary);border:2px solid var(--animal-bg);color:#fff9e3}
.trays .sep{background:var(--animal-sand)}
.tabs{padding:8px;background:rgba(255,255,255,.6);border:2px solid var(--animal-border);border-radius:26px;gap:4px}
.tabs button{background:transparent;border:0;color:var(--animal-text-muted);font-weight:500;border-radius:50px;transition:all .2s var(--animal-ease)}
.tabs button:hover{background:rgba(25,200,185,.1);color:var(--animal-text-body)}
.tabs button[aria-selected="true"]{background:#0cc0b5;color:#fff9e3;font-weight:700;border:0}
.tabs.ico button{border-radius:50px}
.sw{border:2px solid var(--animal-border)}
.pr{color:var(--animal-text)}
#wPrev{background:var(--animal-primary-bg);border:2px solid var(--animal-sand);border-radius:28px}
#wName,#dgIn{font-family:var(--animal-font);font-weight:600;border:2px solid var(--animal-border);color:var(--animal-text);background:#fff}
.x{background:transparent;border:0;color:rgba(114,93,66,.6);font-size:22px;font-weight:500;transition:all .2s}
.x:hover{background:rgba(114,93,66,.1);color:var(--animal-text-body)}
.sheet h2{font-size:24px;font-weight:700;color:var(--animal-text-body)}
.sheet .sub,.wfoot small,.item small,.li small,.places small,.sectionT{color:var(--animal-text-muted)}
.empty{background:var(--animal-bg);color:var(--animal-text-muted)}
#mini{border:2px solid var(--animal-border);border-radius:20px}
.places i{border:2px solid var(--animal-border);border-radius:6px}

const GCH = 480; const groundCache = new Map();
function groundChunk(cx,cy){
  const key = world.seed+":"+cx+","+cy+":"+spriteK; let cv = groundCache.get(key); if (cv) return cv;
  cv = document.createElement("canvas"); cv.width = Math.ceil(GCH*spriteK); cv.height = Math.ceil(GCH*spriteK); const c = cv.getContext("2d");
  c.scale(spriteK,spriteK); c.translate(-cx*GCH,-cy*GCH);
  if (world.cafe){ c.beginPath(); c.rect(cx*GCH,cy*GCH,GCH,GCH); c.clip(); drawCafeFloor(c); groundCache.set(key, cv); return cv; }
  const x0 = Math.max(0,Math.floor(cx*GCH/TT)-1), x1 = Math.min(MW-1,Math.ceil((cx+1)*GCH/TT)+1), y0 = Math.max(0,Math.floor(cy*GCH/TT)-1), y1 = Math.min(MH-1,Math.ceil((cy+1)*GCH/TT)+1);
  const G = world.ground, sd = world.seed % 613;
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){ const n = vnoise(x*0.18,y*0.18,sd); c.fillStyle = mix("#c9e5ae","#b8dc98",n); c.fillRect(x*TT-0.5,y*TT-0.5,TT+1,TT+1); }
  const pass = (types, rad, outline, fill) => { const list = []; for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (types.includes(G[y*MW+x])) list.push([x,y]); if (!list.length) return; c.lineJoin="round"; c.strokeStyle=outline; c.lineWidth=5; for (const [x,y] of list){ ovPath(c,(x+0.5)*TT,(y+0.5)*TT,TT*rad,TT*rad); c.stroke(); } c.fillStyle = fill; for (const [x,y] of list){ ovPath(c,(x+0.5)*TT,(y+0.5)*TT,TT*rad,TT*rad); c.fill(); } };
  pass([WATER,BRIDGE],0.72,"#6fc3bb","#a8e0da");
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){ const g2 = G[y*MW+x]; if (g2===WATER && hash(x*3,y*5) > 0.7){ ov(c,(x+0.3)*TT,(y+0.4)*TT,6,2.4,"#d2f0ec"); } if (g2===WATER && hash(x,y*7) > 0.86){ ov(c,(x+0.6)*TT,(y+0.6)*TT,6,4,"#8ac68a",INK,0.9); } }
  pass([PATH,BRIDGE],0.62,"#d4c4a8","#f0e4c8");
  pass([PLAZA],0.74,"#d4c4a8","#f3eedd");
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){ const g2 = G[y*MW+x]; const px=(x+0.5)*TT, py=(y+0.5)*TT;
    if (g2===PLAZA){ c.strokeStyle="rgba(170,155,135,.35)"; c.lineWidth=1; c.strokeRect(x*TT+4,y*TT+4,TT-8,TT-8); }
    else if (g2===PATH && hash(x*7,y*3) > 0.6){ ov(c,px+(hash(x,y)-0.5)*20,py+(hash(y,x)-0.5)*20,2.2,1.6,"#d9c5a2"); }
    else if (g2===BRIDGE){ rr(c,x*TT-2,y*TT+4,TT+4,TT-8,4,C.woodL,INK,1.2); for (let k=1;k<4;k++) line(c,[x*TT+k*TT/4,y*TT+6,x*TT+k*TT/4,y*TT+TT-6],C.woodD,1); } }
  for (const d of world.deco){ if (d.x < cx*GCH-20 || d.x > (cx+1)*GCH+20 || d.y < cy*GCH-20 || d.y > (cy+1)*GCH+20) continue;
    if (d.k==="flower"){ const col = [C.pink,"#fffdf9",C.yellow,C.orange,"#b9a3df"][d.v]; for (const [ox,oy] of [[0,0],[6,3],[-5,4]]){ for (let i=0;i<5;i++){ const a=i/5*Math.PI*2; ov(c,d.x+ox+Math.cos(a)*2.2,d.y+oy+Math.sin(a)*2.2,1.8,1.8,col); } ov(c,d.x+ox,d.y+oy,1.2,1.2,d.v===2?C.orange:C.yellow); } }
    else { c.beginPath(); c.moveTo(d.x-4,d.y); c.quadraticCurveTo(d.x-3,d.y-5,d.x-1,d.y-6); c.moveTo(d.x,d.y); c.lineTo(d.x+1,d.y-7); c.moveTo(d.x+3,d.y); c.quadraticCurveTo(d.x+4,d.y-4,d.x+6,d.y-5); c.strokeStyle="#8fb87a"; c.lineWidth=1.3; c.lineCap="round"; c.stroke(); } }

/* room chunk cache */
const roomCache = new Map(); const RCH = 300; let roomCacheAt = 0;
function roomChunk(sc,cx,cy,v){
  const key = sc.key+":"+(sc.ver||0)+":"+cx+","+cy+":"+spriteK+":"+Math.round(v.top)+":"+Math.round(v.bot);
  let cv = roomCache.get(key); if (cv) return cv;
  cv = document.createElement("canvas"); cv.width = Math.ceil(RCH*spriteK); cv.height = Math.ceil(RCH*spriteK); const c = cv.getContext("2d");
  c.scale(spriteK,spriteK); c.translate(-cx*RCH,-cy*RCH); c.beginPath(); c.rect(cx*RCH,cy*RCH,RCH,RCH); c.clip();
  sc.draw(c, {x0:cx*RCH, x1:(cx+1)*RCH, top:Math.min(v.top, cy*RCH), bot:Math.max(v.bot,(cy+1)*RCH)});
  roomCache.set(key,cv); if (roomCache.size > 60) roomCache.delete(roomCache.keys().next().value);
  return cv;
}
